<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Styles for Animation -->
    <style>
      .glow-orbit1 {
        animation: float1 14s ease-in-out infinite alternate;
      }
      .glow-orbit2 {
        animation: float2 18s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8, 8;
        animation: dash 20s linear infinite;
      }
      .pulse-node {
        animation: pulse 3s ease-in-out infinite;
      }
      .floating-pill {
        animation: hoverPill 6s ease-in-out infinite alternate;
      }
      @keyframes float1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 40px) scale(1.15); }
      }
      @keyframes float2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-50px, -30px) scale(1.2); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.25); }
      }
      @keyframes hoverPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: -0.01em;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glows -->
  <g class="glow-orbit1">
    <circle cx="200" cy="100" r="180" fill="url(#glowGrad1)" />
  </g>
  <g class="glow-orbit2">
    <circle cx="1000" cy="240" r="220" fill="url(#glowGrad2)" />
  </g>

  <!-- Geometric Grid Layer -->
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Architectural Connector Lines (Background Visual Flow) -->
  <g opacity="0.45">
    <path class="flow-line" d="M 80 80 Q 300 20 600 80 T 1120 70" fill="none" stroke="#6366f1" stroke-width="1.5" />
    <path class="flow-line" d="M 60 280 Q 400 340 750 280 T 1140 290" fill="none" stroke="#ec4899" stroke-width="1.5" />
    <circle cx="600" cy="80" r="4" fill="#818cf8" class="pulse-node" />
    <circle cx="300" cy="50" r="3.5" fill="#c084fc" class="pulse-node" />
    <circle cx="750" cy="280" r="4" fill="#f472b6" class="pulse-node" />
  </g>

  <!-- Interactive Floating Ecosystem Pills -->
  <g class="floating-pill">
    <!-- Visual App Builders Pill -->
    <g transform="translate(180, 48)">
      <rect width="180" height="32" rx="16" fill="url(#cardGrad)" stroke="#4f46e5" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="18" cy="16" r="5" fill="#6366f1" />
      <text x="32" y="21" fill="#e0e7ff" class="pill-text">Visual App Builders</text>
    </g>

    <!-- Open Source LCAP Pill -->
    <g transform="translate(480, 38)">
      <rect width="170" height="32" rx="16" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="18" cy="16" r="5" fill="#a855f7" />
      <text x="32" y="21" fill="#ede9fe" class="pill-text">Open-Source Core</text>
    </g>

    <!-- Enterprise Citizen Dev Pill -->
    <g transform="translate(770, 48)">
      <rect width="210" height="32" rx="16" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="18" cy="16" r="5" fill="#ec4899" />
      <text x="32" y="21" fill="#fce7f3" class="pill-text">Citizen Development</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header & Subtitle -->
  <!-- Main Title -->
  <g transform="translate(600, 155)">
    <text text-anchor="middle" font-size="44" fill="url(#primaryGrad)" class="title-text" filter="drop-shadow(0 2px 14px rgba(99,102,241,0.35))">
      Awesome Low-Code Application Development (LCAP)
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 202)">
    <text text-anchor="middle" font-size="19" fill="#94a3b8" class="subtitle-text">
      The Curated Ecosystem of Enterprise SaaS Platforms &amp; Self-Hosted Open-Source Frameworks
    </text>
  </g>

  <!-- Category Badges / Tags Bar -->
  <g transform="translate(600, 260)">
    <!-- SaaS Leaders -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="135" height="30" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
      <text x="67" y="20" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto">☁️ SaaS Leaders</text>
    </g>

    <!-- Open Source Engines -->
    <g transform="translate(-165, 0)">
      <rect x="0" y="0" width="165" height="30" rx="8" fill="#2e1065" stroke="#6d28d9" stroke-width="1" />
      <text x="82" y="20" text-anchor="middle" fill="#ddd6fe" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto">⚡ Self-Hosted FOSS</text>
    </g>

    <!-- Rapid Internal Tools -->
    <g transform="translate(20, 0)">
      <rect x="0" y="0" width="155" height="30" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="77" y="20" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto">🛠️ Internal Tooling</text>
    </g>

    <!-- Enterprise Modernization -->
    <g transform="translate(195, 0)">
      <rect x="0" y="0" width="135" height="30" rx="8" fill="#831843" stroke="#be185d" stroke-width="1" />
      <text x="67" y="20" text-anchor="middle" fill="#fbcfe8" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto">🚀 RAD &amp; Workflows</text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
