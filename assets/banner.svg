<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a13"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="glowGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#4f46e5" stop-opacity=".25"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></linearGradient><linearGradient id="glowGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".2"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#374151" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes float1{0%{transform:translate(0,0) scale(1)}}@keyframes float2{0%{transform:translate(0,0) scale(1)}}@keyframes pulse{0%{opacity:.4;transform:scale(1)}50%{opacity:.9;transform:scale(1.25)}}@keyframes hoverPill{0%{transform:translateY(0)}}.glow-orbit1{animation:float1 14s ease-in-out infinite alternate}.glow-orbit2{animation:float2 18s ease-in-out infinite alternate}.flow-line{stroke-dasharray:8,8;animation:dash 20s linear infinite}.pulse-node{animation:pulse 3s ease-in-out infinite}.floating-pill{animation:hoverPill 6s ease-in-out infinite alternate}.title-text{font-weight:800;letter-spacing:-.02em}.pill-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:400;letter-spacing:-.01em}.pill-text{font-weight:600;font-size:13px}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)"/><g class="glow-orbit1"><circle cx="200" cy="100" r="180" fill="url(#glowGrad1)"/></g><g class="glow-orbit2"><circle cx="1000" cy="240" r="220" fill="url(#glowGrad2)"/></g><rect width="1200" height="360" fill="url(#grid)"/><g opacity=".45"><path fill="none" stroke="#6366f1" stroke-width="1.5" d="M 80 80 Q 300 20 600 80 T 1120 70" class="flow-line"/><path fill="none" stroke="#ec4899" stroke-width="1.5" d="M 60 280 Q 400 340 750 280 T 1140 290" class="flow-line"/><circle cx="600" cy="80" r="4" fill="#818cf8" class="pulse-node"/><circle cx="300" cy="50" r="3.5" fill="#c084fc" class="pulse-node"/><circle cx="750" cy="280" r="4" fill="#f472b6" class="pulse-node"/></g><g class="floating-pill"><g transform="translate(180, 48)"><rect width="180" height="32" fill="url(#cardGrad)" stroke="#4f46e5" stroke-opacity=".4" stroke-width="1" rx="16"/><circle cx="18" cy="16" r="5" fill="#6366f1"/><text x="32" y="21" fill="#e0e7ff" class="pill-text">Visual App Builders</text></g><g transform="translate(480, 38)"><rect width="170" height="32" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-opacity=".4" stroke-width="1" rx="16"/><circle cx="18" cy="16" r="5" fill="#a855f7"/><text x="32" y="21" fill="#ede9fe" class="pill-text">Open-Source Core</text></g><g transform="translate(770, 48)"><rect width="210" height="32" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity=".4" stroke-width="1" rx="16"/><circle cx="18" cy="16" r="5" fill="#ec4899"/><text x="32" y="21" fill="#fce7f3" class="pill-text">Citizen Development</text></g></g><g><text fill="url(#primaryGrad)" class="title-text" filter="drop-shadow(0 2px 14px rgba(99,102,241,0.35))" font-size="44" text-anchor="middle" transform="translate(600, 155)">Awesome Low-Code Application Development (LCAP)</text></g><g><text fill="#94a3b8" class="subtitle-text" font-size="19" text-anchor="middle" transform="translate(600, 202)">The Curated Ecosystem of Enterprise SaaS Platforms &amp; Self-Hosted Open-Source Frameworks</text></g><g><g transform="translate(600, 260) translate(-320, 0)"><rect width="135" height="30" x="0" y="0" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" rx="8"/><text x="67" y="20" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" text-anchor="middle">☁️ SaaS Leaders</text></g><g transform="translate(600, 260) translate(-165, 0)"><rect width="165" height="30" x="0" y="0" fill="#2e1065" stroke="#6d28d9" stroke-width="1" rx="8"/><text x="82" y="20" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" text-anchor="middle">⚡ Self-Hosted FOSS</text></g><g transform="translate(600, 260) translate(20, 0)"><rect width="155" height="30" x="0" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="77" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" text-anchor="middle">🛠️ Internal Tooling</text></g><g transform="translate(600, 260) translate(195, 0)"><rect width="135" height="30" x="0" y="0" fill="#831843" stroke="#be185d" stroke-width="1" rx="8"/><text x="67" y="20" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" text-anchor="middle">🚀 RAD &amp; Workflows</text></g></g><rect width="1200" height="4" x="0" y="356" fill="url(#primaryGrad)"/></svg>